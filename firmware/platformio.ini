; NETRI Phase 1 — PlatformIO configuration (ESP32 DevKit V1, Arduino framework).
; Mirrors the Wokwi simulation target; build artifacts feed wokwi.toml.
; No libraries are required — the firmware is dependency-free by design
; (RULES.md §13: no unnecessary dependencies).
;
; NOTE: src_dir is ONLY honored in the global [platformio] section — placing it
; inside [env:...] is silently ignored and PIO falls back to the default src/
; ("Nothing to build ... firmware\src folder"). Keep it here.
[platformio]
src_dir = sketch

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
; NETRI headers live in include/netri/ (structured firmware, preserved layout);
; PIO only adds include/ by default, so point the compiler at the module dir.
build_flags = -Iinclude/netri
monitor_speed = 115200
